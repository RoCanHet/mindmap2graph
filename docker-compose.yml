version: '3.8'

services:
  web:
    build: .
    container_name: mindmap2graph-web
    ports:
      - "8501:8501"
    volumes:
      - ./output:/app/output
      - ./.env:/app/.env
    environment:
      - MIRO_ACCESS_TOKEN=${MIRO_ACCESS_TOKEN}
      - MIRO_BOARD_ID=${MIRO_BOARD_ID}
      - MIRO_API_BASE_URL=${MIRO_API_BASE_URL:-https://api.miro.com/v2}
    restart: unless-stopped
    networks:
      - mindmap-network

networks:
  mindmap-network:
    driver: bridge
